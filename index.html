<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>성간 요격대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04050c; --ink:#eaf2ff; --dim:#8aa0c8; --cyan:#3fd6ff; --hot:#ff4a6a; --gold:#ffd23d; --fuel:#ff9a3d; --green:#5cff8a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#04050c; } }
:root[data-theme="dark"]{ --bg:#04050c; }
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"Chakra Petch",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;word-break:keep-all}
canvas{position:fixed;inset:0;display:block;width:100%;height:100%}
.hidden{display:none!important}

#hud{position:fixed;left:0;right:0;top:0;z-index:2;pointer-events:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;
  padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 16px) 0 calc(env(safe-area-inset-left,0px) + 16px)}
#score{font-size:24px;font-weight:700;line-height:1;text-shadow:0 0 10px rgba(63,214,255,.5)}
#best{font-size:12px;color:var(--dim);margin-top:3px}
.c{text-align:center}
#waveLbl{font-size:16px;font-weight:700;letter-spacing:.08em;color:var(--cyan)}
#left{font-size:12px;color:var(--dim);margin-top:2px}
#boss{margin-top:6px;width:min(340px,40vw);display:none}
#boss .nm{font-size:12px;color:var(--hot);letter-spacing:.1em;margin-bottom:3px}
.track{height:6px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
#bossFill{height:100%;width:100%;background:linear-gradient(90deg,var(--hot),var(--gold))}
.r{justify-self:end;text-align:right}
#hull{display:flex;gap:4px;justify-content:flex-end}
.pip{width:11px;height:17px;border-radius:2px;background:var(--cyan);box-shadow:0 0 8px var(--cyan);transform:skewX(-12deg)}
.pip.off{background:rgba(255,255,255,.12);box-shadow:none}
#gauge{margin-top:6px;display:flex;align-items:center;gap:6px;justify-content:flex-end;font-size:11px;color:var(--fuel)}
#gauge .track{width:110px}
#gaugeFill{height:100%;background:linear-gradient(90deg,#ff6a2a,var(--fuel));box-shadow:0 0 8px var(--fuel)}
#wlv{font-size:11px;color:var(--gold);margin-top:4px}
#wprog{width:170px;height:4px;border-radius:2px;background:rgba(255,255,255,.12);margin:6px auto 0;overflow:hidden}
#wprog i{display:block;height:100%;width:0;border-radius:2px;background:linear-gradient(90deg,#1fa8e0,var(--cyan));transition:width .25s}
#wprog.hide{visibility:hidden}
#combo{position:fixed;right:calc(env(safe-area-inset-right,0px) + 20px);top:calc(env(safe-area-inset-top,0px) + 82px);z-index:2;pointer-events:none;text-align:right;
  opacity:0;transform:translateX(12px);transition:opacity .25s,transform .25s}
#combo.on{opacity:1;transform:none}
#combo b{display:block;font-size:28px;font-weight:800;line-height:1;letter-spacing:.02em;text-shadow:0 0 14px rgba(255,210,61,.45)}
#combo span{font-size:12px;font-weight:700;color:var(--gold)}
#combo .bar{height:3px;width:90px;margin:5px 0 0 auto;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
#combo .bar i{display:block;height:100%;background:var(--gold);width:100%}
@media (prefers-reduced-motion: no-preference){#combo.pop b{animation:cpop .22s ease-out}}
@keyframes cpop{0%{transform:scale(1.35)}100%{transform:scale(1)}}
#lowhp{position:fixed;inset:0;pointer-events:none;z-index:1;box-shadow:inset 0 0 110px rgba(255,40,70,.6);opacity:0;transition:opacity .4s}
#lowhp.on{opacity:.55}
@media (prefers-reduced-motion: no-preference){#lowhp.on{animation:lowp 1.1s ease-in-out infinite}}
@keyframes lowp{0%,100%{opacity:.25}50%{opacity:.85}}
.rstats{display:flex;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.rstats div{min-width:64px;padding:5px 10px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);font-size:11px;color:var(--dim);text-align:center}
.rstats b{display:block;font-size:15px;color:var(--ink);margin-top:1px}

#banner{position:fixed;left:0;right:0;top:34%;text-align:center;z-index:2;pointer-events:none;opacity:0;transition:opacity .4s}
#banner.show{opacity:1}
#bT{font-size:clamp(30px,7vw,64px);font-weight:700;letter-spacing:.06em;text-shadow:0 0 22px rgba(63,214,255,.6)}
#bS{font-size:16px;color:var(--dim);margin-top:4px;letter-spacing:.1em}
#banner.boss #bT{color:var(--hot);text-shadow:0 0 22px rgba(255,74,106,.7)}
#banner.boss #bS{color:var(--hot)}
#vig{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse 75% 70% at 50% 50%,transparent 60%,rgba(0,0,6,.5) 100%)}
#dmg{position:fixed;inset:0;pointer-events:none;z-index:1;box-shadow:inset 0 0 120px rgba(255,40,70,.9);opacity:0;transition:opacity .35s}
#boostFx{position:fixed;inset:0;pointer-events:none;z-index:1;box-shadow:inset 0 0 160px rgba(63,214,255,.5);opacity:0}

/* touch controls */
#ctrl{position:fixed;inset:0;z-index:3;pointer-events:none}
#joyZone{position:fixed;left:0;top:0;width:48%;height:100%;pointer-events:auto;touch-action:none}
#joy{position:fixed;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;pointer-events:none;
  left:calc(env(safe-area-inset-left,0px) + 100px);top:calc(100% - env(safe-area-inset-bottom,0px) - 95px);
  background:radial-gradient(circle,rgba(63,214,255,.08),rgba(63,214,255,.02));border:2px solid rgba(63,214,255,.35)}
#joyKnob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;
  background:rgba(63,214,255,.35);border:2px solid rgba(63,214,255,.8);box-shadow:0 0 14px rgba(63,214,255,.5)}
.btn{position:fixed;border-radius:50%;pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;
  font-weight:700;letter-spacing:.04em;-webkit-tap-highlight-color:transparent}
#fireBtn{width:calc(96px*var(--bs,1));height:calc(96px*var(--bs,1));right:calc(env(safe-area-inset-right,0px) + 26px);bottom:calc(env(safe-area-inset-bottom,0px) + 26px);
  background:rgba(255,74,106,.18);border:2px solid rgba(255,74,106,.8);color:#ffd6de;font-size:17px;box-shadow:0 0 18px rgba(255,74,106,.35)}
#boostBtn{width:calc(78px*var(--bs,1));height:calc(78px*var(--bs,1));right:calc(env(safe-area-inset-right,0px) + 26px + 112px*var(--bs,1));bottom:calc(env(safe-area-inset-bottom,0px) + 26px + 44px*var(--bs,1));
  background:rgba(255,154,61,.12);color:#ffe0c2;font-size:13px}
#boostBtn svg{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);transform:rotate(-90deg)}
#boostBtn circle{fill:none;stroke-width:6}
#boostBtn .bg{stroke:rgba(255,154,61,.2)}
#boostBtn .fg{stroke:var(--fuel);stroke-dasharray:283;stroke-linecap:round;filter:drop-shadow(0 0 4px var(--fuel))}
.btn.on{transform:scale(.93);filter:brightness(1.5)}
#boostBtn.empty{opacity:.45}

/* ---------- lobby / screens ---------- */
.screen{position:fixed;inset:0;z-index:5;padding:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-right,0px) + 20px) calc(env(safe-area-inset-bottom,0px) + 18px) calc(env(safe-area-inset-left,0px) + 20px);
  background:linear-gradient(90deg,rgba(4,5,12,.88) 0%,rgba(4,5,12,.55) 38%,rgba(4,5,12,0) 62%),linear-gradient(0deg,rgba(4,5,12,.7),rgba(4,5,12,0) 40%)}
.ltop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.logo{font-size:clamp(30px,6.2vw,58px);font-weight:700;line-height:1;letter-spacing:.02em;
  background:linear-gradient(180deg,#fff 20%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px rgba(63,214,255,.35))}
.tag{font-size:11px;letter-spacing:.42em;color:var(--dim);margin-top:8px}
.chips{display:flex;gap:8px;align-items:center}
.chip{display:flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;font-size:13px;color:var(--dim);
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.chip b{color:var(--ink)} .chip .st{color:var(--gold)}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--ink);
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background .2s,border-color .2s}
.iconbtn:hover,.iconbtn:focus-visible{background:rgba(63,214,255,.14);border-color:rgba(63,214,255,.5);outline:none}
.iconbtn svg{width:20px;height:20px}
.lmenu{position:absolute;left:calc(env(safe-area-inset-left,0px) + 20px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:10px}
.mbtn{display:flex;align-items:center;gap:12px;min-width:210px;padding:10px 16px 10px 10px;border-radius:14px;cursor:pointer;text-align:left;font:inherit;color:var(--ink);
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .15s,background .2s,border-color .2s}
.mbtn:hover,.mbtn:focus-visible{background:rgba(63,214,255,.1);border-color:rgba(63,214,255,.45);transform:translateX(3px);outline:none}
.mbtn .mi{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:rgba(63,214,255,.12);color:var(--cyan)}
.mbtn .mi svg{width:20px;height:20px}
.mbtn b{display:block;font-size:15px} .mbtn small{display:block;font-size:12px;color:var(--dim);margin-top:2px}
.playbtn{position:absolute;right:calc(env(safe-area-inset-right,0px) + 20px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);
  display:flex;align-items:center;gap:18px;padding:14px 18px 14px 28px;border:0;border-radius:18px;cursor:pointer;font:inherit;color:#04111a;
  background:linear-gradient(135deg,#8ff0ff,var(--cyan) 55%,#1fa8e0);box-shadow:0 10px 40px rgba(63,214,255,.35),inset 0 1px 0 rgba(255,255,255,.6);transition:transform .15s,box-shadow .2s}
.playbtn:hover,.playbtn:focus-visible{transform:translateY(-2px);box-shadow:0 14px 50px rgba(63,214,255,.5),inset 0 1px 0 rgba(255,255,255,.6);outline:none}
.playbtn:active{transform:scale(.97)}
.playbtn .pt{text-align:left}
.playbtn small{display:block;font-size:11px;font-weight:700;letter-spacing:.3em;opacity:.7}
.playbtn span{display:block;font-size:30px;font-weight:700;line-height:1.05;letter-spacing:.06em}
.playbtn .arr{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:rgba(4,17,26,.9);color:var(--cyan)}
.playbtn .arr svg{width:22px;height:22px}
@media (prefers-reduced-motion: no-preference){.playbtn .arr{animation:nudge 1.6s ease-in-out infinite}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
/* stage select */
#stages{background:rgba(4,5,12,.86);display:flex;flex-direction:column;gap:14px}
.shead{display:flex;align-items:center;gap:12px}
.shead h2{margin:0;font-size:20px;flex:1}
#grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:10px;flex:1;align-content:center;max-width:960px;width:100%;margin:0 auto}
.tile{aspect-ratio:1/1.05;border-radius:14px;cursor:pointer;font:inherit;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.12);transition:transform .15s,border-color .2s,background .2s;padding:0}
.tile:hover:not(:disabled),.tile:focus-visible{transform:translateY(-2px);border-color:rgba(63,214,255,.6);outline:none}
.tile .n{font-size:clamp(16px,2.6vw,24px);font-weight:700;line-height:1}
.tile .s{font-size:10px;letter-spacing:1px;color:rgba(255,255,255,.18)} .tile .s i{font-style:normal;color:var(--gold)}
.tile.boss{border-color:rgba(255,74,106,.45);background:linear-gradient(180deg,rgba(255,74,106,.16),rgba(255,74,106,.04))}
.tile.boss::after{content:"BOSS";position:absolute;top:5px;font-size:8px;letter-spacing:.15em;color:var(--hot);font-weight:700}
.tile.next{border-color:var(--cyan);box-shadow:0 0 18px rgba(63,214,255,.3)}
.tile:disabled{opacity:.3;cursor:not-allowed}
.tile svg{width:16px;height:16px;opacity:.8}
/* modals */
.modal{position:fixed;inset:0;z-index:7;display:grid;place-items:center;padding:14px;background:rgba(2,3,8,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.panel{width:min(620px,94vw);max-height:92vh;overflow:auto;border-radius:20px;padding:18px 20px;
  background:linear-gradient(180deg,rgba(22,28,52,.96),rgba(10,13,28,.96));border:1px solid rgba(255,255,255,.12);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.panel.small{width:min(400px,92vw);text-align:center}
.phead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.phead h2{margin:0;font-size:19px;display:flex;align-items:center;gap:8px}
.rows{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);font-size:14px}
.row input[type=range]{width:120px;accent-color:var(--cyan)}
.tog{appearance:none;-webkit-appearance:none;width:44px;height:24px;border-radius:999px;background:rgba(255,255,255,.18);position:relative;cursor:pointer;transition:background .2s;flex:none;margin:0}
.tog::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.tog:checked{background:var(--cyan)} .tog:checked::after{transform:translateX(20px)}
.tog:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.pfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.panel.small .pfoot{justify-content:center}
.pbtn{font:inherit;font-size:15px;font-weight:700;padding:11px 20px;border-radius:12px;cursor:pointer;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);transition:background .2s,border-color .2s}
.pbtn:hover,.pbtn:focus-visible{background:rgba(255,255,255,.12);outline:none}
.pbtn.primary{color:#04111a;border:0;background:linear-gradient(135deg,#8ff0ff,var(--cyan))}
.pbtn.danger{color:#ffd6de;border-color:rgba(255,74,106,.5);background:rgba(255,74,106,.12)}
.pbtn.primary.danger{color:#fff;background:linear-gradient(135deg,#ff6a86,var(--hot))}
.warn{width:52px;height:52px;margin:4px auto 10px;border-radius:50%;display:grid;place-items:center;font-size:26px;font-weight:700;color:var(--hot);background:rgba(255,74,106,.14);border:1px solid rgba(255,74,106,.45)}
.panel h3{margin:0 0 6px;font-size:19px}
.panel p{margin:0;color:var(--dim);font-size:14px;line-height:1.55}
.rtitle{font-size:26px;font-weight:700;letter-spacing:.03em}
.rtitle.fail{color:var(--hot)}
.rstars{font-size:34px;letter-spacing:6px;margin:6px 0 2px;color:rgba(255,255,255,.15)} .rstars i{font-style:normal;color:var(--gold);text-shadow:0 0 14px rgba(255,210,61,.6)}
.rscore{font-size:30px;font-weight:700} .rsub{font-size:13px;color:var(--gold);min-height:18px}
/* coins */
.cn{display:inline-block;width:14px;height:14px;vertical-align:-2px;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);background:linear-gradient(135deg,#f2fbff 0%,#9fe2ff 35%,#4fb4f0 65%,#2a86d0 100%);flex:none}
#coinHud{margin-top:4px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;color:#8fdcff}
.rcoin{margin-top:6px;font-size:15px;font-weight:700;color:#8fdcff;display:flex;align-items:center;justify-content:center;gap:6px;min-height:20px}
/* hangar */
#hangar{display:flex;flex-direction:column;gap:10px}
#hangar.hidden{display:none!important}
.hpanel{flex:1;min-height:0;width:min(480px,58vw);display:flex;flex-direction:column;border-radius:18px;overflow:hidden;
  background:rgba(10,14,30,.78);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tabs{display:flex;gap:4px;padding:6px;border-bottom:1px solid rgba(255,255,255,.08)}
.tab{flex:1;font:inherit;font-size:13px;font-weight:700;padding:8px 4px;border-radius:10px;border:0;cursor:pointer;color:var(--dim);background:transparent;transition:background .2s,color .2s}
.tab:hover{color:var(--ink)} .tab.on{color:#04111a;background:var(--cyan)}
.tab:focus-visible{outline:2px solid var(--gold)}
.hbody{flex:1;overflow:auto;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.hsum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.hsum .chip{height:30px;font-size:12px}
.srow{display:grid;grid-template-columns:86px 1fr 64px;align-items:center;gap:10px;font-size:13px}
.srow span{color:var(--dim)} .srow b{text-align:right;font-size:13px}
.sbar{height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.sbar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#1fa8e0,var(--cyan))}
.sbar i.full{background:linear-gradient(90deg,#e8a820,var(--gold))}
.urow,.card{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07)}
.card{cursor:pointer;transition:border-color .2s,background .2s}
.card:hover{border-color:rgba(63,214,255,.35)}
.card.pv{border-color:var(--cyan);background:rgba(63,214,255,.08)}
.uinfo,.cinfo{flex:1;min-width:0}
.uinfo b,.cinfo b{font-size:14px} .lv{font-size:11px;color:var(--cyan);margin-left:6px;font-weight:700}
.pips{display:flex;gap:3px;margin:5px 0 4px}
.pips i{flex:1;max-width:18px;height:5px;border-radius:2px;background:rgba(255,255,255,.1)} .pips i.on{background:var(--cyan)}
.uinfo small,.cinfo small{display:block;font-size:12px;color:var(--dim);line-height:1.4}
.cinfo small em{font-style:normal;color:var(--gold)}
.ubtn{font:inherit;min-width:92px;padding:7px 10px;border-radius:12px;cursor:pointer;border:0;color:#04111a;background:linear-gradient(135deg,#8ff0ff,var(--cyan));display:flex;flex-direction:column;align-items:center;gap:1px;flex:none}
.ubtn span{font-size:10px;font-weight:700;opacity:.75}
.ubtn b{font-size:14px;display:flex;align-items:center;gap:5px}
.ubtn.buy{background:linear-gradient(135deg,#eaf8ff,#8fdcff)}
.ubtn.eq{background:rgba(255,255,255,.1);color:var(--ink)}
.ubtn:disabled{opacity:.4;cursor:not-allowed}
.cbtns{display:flex;flex-direction:column;gap:6px}
.ubtn.up{background:linear-gradient(135deg,#ffe78a,var(--gold))}
.wlrow{display:flex;align-items:center;gap:8px;margin-top:5px}
.wlrow .pips{width:96px;margin:0}
.wlrow .pips i{background:rgba(255,255,255,.12)}.wlrow .pips i.on{background:var(--gold)}
.wlrow .lv{font-size:11px;font-weight:700;color:var(--gold)}
.wlfx{display:block;margin-top:3px;font-size:11px!important;color:var(--ink)!important;opacity:.85}
.ubtn.max{background:rgba(255,210,61,.14);color:var(--gold);cursor:default;opacity:1}
.cicon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.06)}
.cicon svg{width:30px;height:30px}
.sw{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.swb{aspect-ratio:1;border-radius:12px;cursor:pointer;border:2px solid transparent;padding:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.swb.on{border-color:#fff;box-shadow:0 0 0 2px var(--cyan)}
.swt{font-size:13px;color:var(--dim);margin:4px 0 2px}
.hinfo{position:absolute;right:calc(env(safe-area-inset-right,0px) + 22px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);text-align:right;pointer-events:none}
.hinfo b{display:block;font-size:24px;letter-spacing:.03em}
.hinfo span{font-size:13px;color:var(--dim)}
.hinfo em{display:inline-block;font-style:normal;font-size:11px;color:var(--gold);border:1px solid rgba(255,210,61,.5);border-radius:6px;padding:1px 6px;margin-bottom:4px}
#hgToast{position:fixed;left:calc(58vw + (42vw - env(safe-area-inset-right,0px))/2);top:40%;white-space:nowrap;transform:translate(-50%,-50%) scale(.9);z-index:8;pointer-events:none;opacity:0;transition:opacity .2s,transform .2s;
  padding:14px 26px;border-radius:16px;font-size:22px;font-weight:700;background:rgba(10,14,30,.9);border:1px solid rgba(255,255,255,.15);text-align:center}
#hgToast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#hgToast.ok{color:var(--green);border-color:rgba(92,255,138,.5);box-shadow:0 0 30px rgba(92,255,138,.25)}
#hgToast.no{color:var(--hot);border-color:rgba(255,74,106,.5)}
#hgToast small{display:block;font-size:13px;font-weight:400;color:var(--dim);margin-top:2px}
@media (prefers-reduced-motion: no-preference){#hgToast.no.show{animation:shk .35s}}
@keyframes shk{0%,100%{margin-left:0}25%{margin-left:-8px}75%{margin-left:8px}}
#pauseBtn{position:fixed;z-index:4;top:calc(env(safe-area-inset-top,0px) + 8px);right:calc(env(safe-area-inset-right,0px) + 12px)}
#hud .r{padding-right:52px}
#tut{position:fixed;left:calc(env(safe-area-inset-left,0px) + 16px);top:calc(env(safe-area-inset-top,0px) + 62px);z-index:2;pointer-events:none;
  width:min(250px,30vw);text-align:left;padding:8px 12px;border-radius:12px;font-size:13px;line-height:1.45;
  background:rgba(10,14,30,.55);border:1px solid rgba(63,214,255,.25);border-left:3px solid var(--cyan);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#tut small{display:block;color:var(--cyan);font-size:11px;letter-spacing:.2em;margin-bottom:3px}
#rotate{position:fixed;inset:0;z-index:9;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:24px}
#rotate .ph{width:54px;height:92px;border:3px solid var(--cyan);border-radius:10px;animation:rot 2s ease-in-out infinite;box-shadow:0 0 18px rgba(63,214,255,.4)}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (prefers-reduced-motion: reduce){#rotate .ph{animation:none;transform:rotate(-90deg)}}
#rotate p{font-size:17px;margin:0}
</style>

<script>

const rand=(a,b)=>a+Math.random()*(b-a);

function cloudPush(){if(!cloudRef)return;clearTimeout(cloudT);cloudT=setTimeout(()=>{cloudRef.set({prog:JSON.parse(JSON.stringify(prog)),set:JSON.parse(JSON.stringify(settings)),t:prog._t||Date.now()}).catch(()=>{});},600);}

prog.coins=prog.coins||0;prog.wl=Object.assign({blaster:0,scatter:0,homing:0,laser:0,rail:0},prog.wl||{});prog.up=Object.assign({hp:0,dmg:0,rate:0,bspd:0,bsize:0,bcap:0,bpow:0},prog.up||{});

}

];

  const isBoss=isBossStage(stage)&&waveIdx===waveCount;
  if(isBoss){
    queue.push({t,kind:'boss'});waveTotal=0;
    for(let i=0;i<2+stage/5;i++)queue.push({t:t+5+i*.5,kind:'scout',slot:{x:rand(-boundX*.7,boundX*.7),y:rand(-2,3.5),z:rand(-40,-52)}});
  }else{

    const nH=D>=3?1+Math.floor((D-3)*.3):0,nI=D>=2?2+Math.floor((D-2)*.5):0;
    let nS=Math.max(8,total-nH-nI);

    while(nS>0){const k=Math.min(nS,3+Math.floor(Math.random()*3));groups.push({kind:'scout',k,type:types[Math.floor(Math.random()*types.length)]});nS-=k;}

}

const msMat=new THREE.MeshStandardMaterial({color:0xffd21f,emissive:0x7a5a00,metalness:.3,roughness:.4});
function fireMissile(from,dir){
  const g=new THREE.Group();g.add(new THREE.Mesh(msBody,msMat));const n=new THREE.Mesh(msNose,msMat);n.position.z=-.6;g.add(n);
  const gl=glowSprite(0xffc23d,1.3);gl.position.z=.55;g.add(gl);

const beamGeo=new THREE.CylinderGeometry(1,1,1,12,1,true);
function beamBetween(mesh,a,b,r){
  const d=new V3().subVectors(b,a),len=d.length();
  mesh.position.copy(a).addScaledVector(d,.5);mesh.scale.set(r,len,r);
  mesh.quaternion.setFromUnitVectors(new V3(0,1,0),d.normalize());mesh.visible=true;
}
function beamMesh(color,op){const m=new THREE.Mesh(beamGeo,new THREE.MeshBasicMaterial({color,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));m.visible=false;scene.add(m);return m;}
const lzOwners=new Set();
function sweepLasers(){for(const e of lzOwners){if(!e.lz)lzOwners.delete(e);else if(!enemies.includes(e)){clearLaser(e);lzOwners.delete(e);}}}
const _lk=new THREE.Object3D();
function smoothLook(o,target,dt,rate){_lk.position.copy(o.position);_lk.lookAt(target);o.quaternion.slerp(_lk.quaternion,Math.min(1,dt*rate));}
function clearLaser(e){if(!e.lz)return;for(const k of['tele','core','glow','orb'])if(e.lz[k]){scene.remove(e.lz[k]);e.lz[k].material.dispose();}e.lz=null;}
function segDist(p,a,b){const ab=new V3().subVectors(b,a),t=clamp(new V3().subVectors(p,a).dot(ab)/ab.lengthSq(),0,1);return p.distanceTo(a.clone().addScaledVector(ab,t));}
function laserTarget(){const P=pl.g.position;return new V3(clamp(P.x,-boundX,boundX),clamp(P.y,-boundY,boundY+.6),P.z);}
function updateLaser(e,dt,playing){
  const lz=e.lz,P=pl.g.position;lz.t+=dt;
  const a=nosePos(e,2.6);
  if(lz.state==='charge'){
    if(lz.t<2.2)lz.target.lerp(laserTarget(),Math.min(1,dt*4));
    const dir=new V3().subVectors(lz.target,a).normalize(),b=a.clone().addScaledVector(dir,a.distanceTo(lz.target)+60);
    beamBetween(lz.tele,a,b,lz.t<2.2?.05:.09);
    const blink=lz.t>2.2?(Math.sin(T*40)>0?1:.25):.35+.15*Math.sin(T*10);
    lz.tele.material.opacity=blink*.8;lz.tele.material.color.setHex(lz.t>2.2?0xff4a6a:0x6ab8ff);
    lz.orb.position.copy(a);lz.orb.scale.setScalar(.5+lz.t*1.3+Math.random()*.3);
    if(lz.t>=3){
      lz.state='fire';lz.t=0;lz.a=a.clone();lz.b=b.clone();
      scene.remove(lz.tele);lz.tele.material.dispose();lz.tele=null;
      lz.core=beamMesh(0xffffff,1);lz.glow=beamMesh(0x4a9cff,.6);
      beamBetween(lz.core,lz.a,lz.b,.28);beamBetween(lz.glow,lz.a,lz.b,.8);
      SFX.laser();shake=Math.max(shake,.25);
    }
  }else{
    const u=lz.t/.55;
    lz.core.scale.x=lz.core.scale.z=.28*(1-u*.7);lz.glow.scale.x=lz.glow.scale.z=.8*(1-u*.5);
    lz.core.material.opacity=1-u;lz.glow.material.opacity=.6*(1-u);lz.orb.scale.setScalar(4*(1-u));
    if(playing&&lz.t<.4&&segDist(P,lz.a,lz.b)<1)hurt();
    if(u>=1){clearLaser(e);e.cd=rand(1.5,2.5);}
  }
}
function nosePos(e,dist=1.8){return new V3().subVectors(pl.g.position,e.m.position).normalize().multiplyScalar(dist).add(e.m.position);}

/* ============ fx ============ */
const RING=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
  const gr=g.createRadialGradient(64,64,36,64,64,62);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(.72,'rgba(255,255,255,.95)');gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,128,128);return new THREE.CanvasTexture(c);})();
function ringSprite(color,op=1){return new THREE.Sprite(new THREE.SpriteMaterial({map:RING,color,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false,opacity:op}));}
function ringFx(pos,color,size,dur){const r=ringSprite(color);r.position.copy(pos);scene.add(r);flashes.push({m:r,t:0,max:dur,s:size,v:null});}
const shardGeo=new THREE.TetrahedronGeometry(.25),shardMats={};
function explode(pos,color,size=1){
  const f=glowSprite(color,.1);f.position.copy(pos);scene.add(f);flashes.push({m:f,t:0,max:.45*size,s:8*size,v:null});
  const w=glowSprite(0xffffff,.1);w.position.copy(pos);scene.add(w);flashes.push({m:w,t:0,max:.25*size,s:4*size,v:null});
  if(size>=.6){ringFx(pos,color,11*size,.45+.1*size);
    for(let i=0;i<Math.round(5*size);i++){const e=glowSprite(color,.9,.9);e.position.copy(pos);scene.add(e);
      flashes.push({m:e,t:0,max:rand(.35,.7),s:.1,v:new V3(rand(-1,1),rand(-1,1),rand(-1,1)).normalize().multiplyScalar(rand(8,22)*Math.sqrt(size)),shrink:true});}}
  const mat=shardMats[color]||(shardMats[color]=new THREE.MeshBasicMaterial({color}));
  for(let i=0;i<12*size;i++){const m=new THREE.Mesh(shardGeo,i%3?mat:shardMats[0x555566]||(shardMats[0x555566]=new THREE.MeshBasicMaterial({color:0x555566})));
    m.position.copy(pos);scene.add(m);shards.push({m,v:new V3(rand(-1,1),rand(-1,1),rand(-1,1)).normalize().multiplyScalar(rand(4,16)*Math.sqrt(size)),life:rand(.5,1),max:1});}
}
function spark(pos,color){const f=glowSprite(color,.1);f.position.copy(pos);scene.add(f);flashes.push({m:f,t:0,max:.15,s:1.6,v:null});}

/* ============ pickups ============ */
const gemGeo=new THREE.IcosahedronGeometry(.42,0);
const gemMat=new THREE.MeshStandardMaterial({color:0x8fdcff,emissive:0x1f78c0,emissiveIntensity:.75,metalness:.35,roughness:.08,flatShading:true,transparent:true,opacity:.92,envMapIntensity:1.6});
const gemCore=new THREE.MeshBasicMaterial({color:0xf3eaff});
function makePickup(kind,pos,val=1){
  const g=new THREE.Group();
  if(kind==='coin'){
    const gm=new THREE.Mesh(gemGeo,gemMat);gm.rotation.set(.35,0,.2);g.add(gm);
    g.add(new THREE.Mesh(new THREE.IcosahedronGeometry(.16,0),gemCore));
    g.add(glowSprite(0x7fd4ff,val>1?2.8:1.8,.6));if(val>1)g.scale.setScalar(1.6);
  }else if(kind==='core'){
    const can=new THREE.Mesh(new THREE.CylinderGeometry(.26,.26,.8,12),new THREE.MeshStandardMaterial({color:0x7a3a10,emissive:0xff7a1a,emissiveIntensity:.55,metalness:.4,roughness:.4}));can.rotation.z=Math.PI/2;g.add(can);
    for(const x of[-.25,.25]){const r=new THREE.Mesh(new THREE.TorusGeometry(.3,.06,6,16),new THREE.MeshBasicMaterial({color:0xff9a3d}));r.rotation.y=Math.PI/2;r.position.x=x;g.add(r);}
    const c=new THREE.Mesh(new THREE.SphereGeometry(.18,10,8),new THREE.MeshBasicMaterial({color:0xffd0a0}));g.add(c);
    g.add(glowSprite(0xff9a3d,2.6,.9));
  }else if(kind==='pow'){
    const b=new THREE.Mesh(new THREE.OctahedronGeometry(.5),new THREE.MeshStandardMaterial({color:0xffd23d,emissive:0x6a5000,metalness:.5,roughness:.3,flatShading:true}));g.add(b);
    g.add(glowSprite(0xffd23d,2.4,.8));
  }else{
    const m=new THREE.MeshStandardMaterial({color:0x5cff8a,emissive:0x0e5a24});
    g.add(new THREE.Mesh(new THREE.BoxGeometry(.8,.25,.25),m));g.add(new THREE.Mesh(new THREE.BoxGeometry(.25,.8,.25),m));
    g.add(glowSprite(0x5cff8a,2.4,.8));
  }
  g.position.copy(pos);scene.add(g);pickups.push({g,kind,val,ph:rand(0,6)});
}
function dropFrom(pos,kind){
  if(kind==='boss'){for(let k=0;k<8;k++)makePickup('coin',pos.clone().add(new V3(rand(-4,4),rand(-2,2),rand(-2,2))));makePickup('coin',pos.clone(),5);}
  else if(Math.random()<.35)makePickup('coin',pos.clone().add(new V3(0,.8,0)),kind==='heavy'?3:1);
  const r=Math.random();
  if(kind==='boss'){makePickup('coin',pos.clone().add(new V3(-2,0,0)),5);makePickup('hp',pos.clone().add(new V3(2,0,0)));makePickup('core',pos.clone().add(new V3(0,2,0)));makePickup('core',pos.clone().add(new V3(0,-2,0)));return;}
  if(r<.3)makePickup('core',pos);
  else if(r<.36&&pl.hp<pl.maxHp)makePickup('hp',pos);
}

/* ============ damage ============ */
function updatePlayerLaser(dt,on,P){
  if(!pl.lz){pl.lz={core:beamMesh(0xffffff,.9),glow:beamMesh(0x3fd6ff,.5)};}
  if(!pl.lzAux)pl.lzAux=[];
  while(pl.lzAux.length<pl.wlv)pl.lzAux.push({core:beamMesh(0xffffff,.85),glow:beamMesh(0x3fd6ff,.4)});
  if(!on){pl.lz.core.visible=pl.lz.glow.visible=false;for(const x of pl.lzAux)x.core.visible=x.glow.visible=false;}
  if(laserGain)laserGain.gain.value+=((on?.06:0)-laserGain.gain.value)*Math.min(1,dt*10+.01);
  if(!on)return;
  const w=.42*S.bsize,a=new V3(P.x,P.y-.34,P.z-1.5);
  let hitE=-1,hz=-1e9;
  for(let j=0;j<enemies.length;j++){const e=enemies[j],q=e.m.position;if(q.z<P.z-1&&Math.abs(q.x-P.x)<e.hx+w&&Math.abs(q.y-P.y)<e.hy+w&&q.z>hz){hz=q.z;hitE=j;}}
  const b=new V3(P.x,P.y-.34,hitE>=0?hz+.5:P.z-230);
  beamBetween(pl.lz.core,a,b,w*.45*(1+Math.random()*.2));beamBetween(pl.lz.glow,a,b,w*1.3);pl.lz.glow.material.color.copy(pbMat.color);
  for(let i=missiles.length-1;i>=0;i--){const q=missiles[i].m.position;if(q.z<P.z&&q.z>b.z&&Math.abs(q.x-P.x)<w+.5&&Math.abs(q.y-P.y)<w+.5){explode(q.clone(),0xffc23d,.4);scene.remove(missiles[i].m);missiles.splice(i,1);}}
  if(hitE>=0){if(Math.random()<.35)spark(b,pbMat.color.getHex());damageEnemy(hitE,24*S.dmg*dt,null);}
  // auxiliary beams: each takes a different enemy, nearest first; only double up when beams outnumber enemies
  const mainE=hitE>=0?enemies[hitE]:null;
  const list=enemies.filter(e=>e!==mainE&&e.hp>0&&e.m.position.z<P.z-2&&e.m.position.z>P.z-150)
    .sort((x,y)=>x.m.position.distanceToSquared(P)-y.m.position.distanceToSquared(P));
  if(mainE)list.push(mainE);
  const targets=pl.lzAux.map((_,k)=>k<pl.wlv&&list.length?list[k%list.length]:null);
  for(let k=0;k<pl.lzAux.length;k++){const bm=pl.lzAux[k],e=targets[k];
    if(!e){bm.core.visible=bm.glow.visible=false;continue;}
    const sd=k%2?1:-1,o=new V3(P.x+sd*(.75+Math.floor(k/2)*.35),P.y-.25,P.z-.9),q=e.m.position;
    beamBetween(bm.core,o,q,w*.28*(1+Math.random()*.25));beamBetween(bm.glow,o,q,w*.8);bm.glow.material.color.copy(pbMat.color);
    const j=enemies.indexOf(e);if(j>=0){damageEnemy(j,14*S.dmg*dt,null);if(Math.random()<.2)spark(q.clone(),pbMat.color.getHex());}}
}
function hurt(){
  if(pl.inv>0||!pl.alive)return;
  pl.hp--;if(mode==='tutorial')pl.hp=Math.max(1,pl.hp);combo=0;comboT=0;waveHit=true;pl.inv=S.inv;shake=.55;SFX.hit();explode(pl.g.position.clone(),0x3fd6ff,.5);
  if(settings.vib&&navigator.vibrate){try{navigator.vibrate(70);}catch(e){}}
  const d=$('dmg');d.style.opacity=1;setTimeout(()=>d.style.opacity=0,160);
  drawHull();if(pl.hp<=0)gameOver();
}
function killEnemy(i,ram){
  const e=enemies[i],p=e.m.position.clone();clearLaser(e);
  explode(p,e.kind==='boss'?0xffd23d:e.f.mats[1].color.getHex(),e.kind==='boss'?4:e.kind==='heavy'?1.6:1);
  SFX.boom(e.kind==='boss'||e.kind==='heavy');
  combo++;comboT=2.8;runMaxCombo=Math.max(runMaxCombo,combo);runKills++;if(mode==='stage'&&e.kind!=='boss')waveKilled++;
  const cm=1+Math.min(combo-1,40)*.05;
  score+=Math.round(e.score*(ram?1.5:1)*cm);comboPop();
  if(e.elite){makePickup('coin',p.clone(),5);if(Math.random()<.5)makePickup('coin',p.clone().add(new V3(1.2,0,0)),3);ringFx(p,0xffd23d,14,.6);}
  if(e.kind==='boss'){shake=1.2;if(pl.hp<pl.maxHp){pl.hp++;drawHull();}}
  dropFrom(p,e.kind);
  scene.remove(e.m);enemies.splice(i,1);
}
function comboPop(){
  if(combo<2)return;const c=$('combo');$('comboN').textContent=combo+' 콤보';$('comboM').textContent='점수 ×'+(1+Math.min(combo-1,40)*.05).toFixed(2);
  c.classList.add('on');c.classList.remove('pop');void c.offsetWidth;c.classList.add('pop');
}
function gameOver(){
  pl.alive=false;pl.g.visible=false;explode(pl.g.position.clone(),0x3fd6ff,2.5);SFX.boom(true);
  inp.fire=inp.boost=false;
  setTimeout(()=>{if(game==='play')showResult('fail');},1500);
}
function clearAll(){
  for(const e of enemies)clearLaser(e);for(const ms of missiles)scene.remove(ms.m);missiles.length=0;
  for(const a of[enemies,pbul,ebul,pickups])for(const o of a)scene.remove(o.m||o.g);
  for(const a of[flashes,shards])for(const o of a)scene.remove(o.m);
  enemies.length=pbul.length=ebul.length=pickups.length=flashes.length=shards.length=0;
  for(const h of phm)scene.remove(h.m);phm.length=0;if(pl.lz)pl.lz.core.visible=pl.lz.glow.visible=false;if(pl.lzAux)for(const x of pl.lzAux)x.core.visible=x.glow.visible=false;
}

  if(touchMode&&!document.fullscreenElement){try{const r=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();
    if(r&&r.then)r.then(()=>{try{screen.orientation.lock('landscape').catch(()=>{});}catch(e){}}).catch(()=>{});}catch(e){}}
}
function hideScreens(){for(const id of['lobby','stages','result','settings','confirm','hangar'])$(id).classList.add('hidden');menuOpen=false;}

function showResult(kind){
  game='result';chrome();inp.fire=inp.boost=false;$('tut').classList.add('hidden');
  const bonusC=kind==='clear'?10+stage*3:kind==='tutorial'?20:0,gained=Math.floor(runCoins)+bonusC;
  prog.coins+=gained;runCoins=0;saveProg();
  $('rCoin').innerHTML='<span class="cn"></span>+'+gained+' 크리스탈'+(bonusC?' <span style="color:var(--dim);font-weight:400;font-size:12px">(클리어 보너스 '+bonusC+' 포함)</span>':'');
  const t=$('rTitle'),sub=$('rSub');t.classList.toggle('fail',kind==='fail');
  const mm=Math.floor(runTime/60),ss=Math.floor(runTime%60);
  $('rStats').innerHTML=kind==='tutorial'?'':'<div>격추<b>'+runKills+'</b></div><div>최대 콤보<b>'+runMaxCombo+'</b></div><div>시간<b>'+mm+':'+String(ss).padStart(2,'0')+'</b></div>';
  $('combo').classList.remove('on');$('lowhp').classList.remove('on');
  $('rRetry').classList.toggle('hidden',kind==='tutorial');
  $('rNext').classList.add('hidden');sub.textContent='';
  if(kind==='tutorial'){t.textContent='튜토리얼 완료';$('rStars').innerHTML='';$('rScore').textContent='준비 완료!';
    $('rNext').textContent='스테이지 1 시작';$('rNext').classList.remove('hidden');$('rNext').onclick=()=>startStage(1);}
  else if(kind==='fail'){t.textContent='격추당했습니다';$('rStars').innerHTML='';$('rScore').textContent=score.toLocaleString('ko-KR')+'점';
    sub.textContent='스테이지 '+stage+' · 웨이브 '+waveIdx+'/'+waveCount;}
  else{
    const hr=pl.hp/pl.maxHp,stars=hr>=.75?3:hr>=.4?2:1;const prevBest=prog.best[stage]||0;
    prog.best[stage]=Math.max(prevBest,score);prog.stars[stage]=Math.max(prog.stars[stage]||0,stars);
    if(stage===prog.unlocked&&stage<20)prog.unlocked=stage+1;if(stage===20)prog.unlocked=Math.max(prog.unlocked,20);saveProg();
    t.textContent=stage===20?'모든 스테이지 클리어!':'스테이지 '+stage+' 클리어';
    $('rStars').innerHTML='<i>★</i>'.repeat(stars)+'★'.repeat(3-stars);
    $('rScore').textContent=score.toLocaleString('ko-KR')+'점';
    sub.textContent=score>prevBest?'최고 기록 달성!':'최고 '+prevBest.toLocaleString('ko-KR')+'점';
    if(stage<20){$('rNext').textContent='다음 스테이지';$('rNext').classList.remove('hidden');$('rNext').onclick=()=>startStage(stage+1);}
  }

      if(Math.abs(p.x-q.x)<e.hx+b.r&&Math.abs(p.y-q.y)<e.hy+b.r&&p.z<q.z+e.hz&&z0>q.z-e.hz){
        if(b.pierce)b.hitSet.add(e);else hit=true;damageEnemy(j,b.fo?b.dmg*Math.max(.55,1.5-b.dist/b.range):b.dmg,p);if(hit)break;}}
    if(hit||b.dist>b.range){scene.remove(b.m);pbul.splice(i,1);}
  }
  for(let i=phm.length-1;i>=0;i--){
    const h=phm[i],p=h.m.position;h.life-=dt;h.spd=Math.min(h.max,h.spd+95*dt);
    h.age+=dt;if(!h.t||!enemies.includes(h.t))h.t=homTarget(h);
    const cur=h.v.clone().normalize();
    if(h.t){const want=new V3().subVectors(h.t.m.position,p).normalize(),ang=cur.angleTo(want);if(ang>1e-4)cur.lerp(want,Math.min(1,(h.age<.22?1.2:5.5)*dt/ang)).normalize();}
    else cur.lerp(new V3(0,0,-1),Math.min(1,dt*2)).normalize();
    h.v.copy(cur).multiplyScalar(h.spd);p.addScaledVector(h.v,dt);h.m.lookAt(tmp.copy(p).sub(h.v));
    if(Math.random()<.5){const s=glowSprite(pbMat.color.getHex(),.5,.6);s.position.copy(p);scene.add(s);flashes.push({m:s,t:0,max:.25,s:.1,v:null,shrink:true});}
    let hit=false;const rr=.5*S.bsize;
    for(let j=enemies.length-1;j>=0;j--){const e=enemies[j],q=e.m.position;
      if(Math.abs(p.x-q.x)<e.hx+rr&&Math.abs(p.y-q.y)<e.hy+rr&&Math.abs(p.z-q.z)<e.hz+rr){explode(p.clone(),pbMat.color.getHex(),.35);damageEnemy(j,h.dmg,null);hit=true;break;}}
    if(hit||h.life<=0||p.z<P.z-260){scene.remove(h.m);phm.splice(i,1);}
  }

  /* --- enemies --- */
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i],m=e.m.position;e.t+=dt;
    if(e.kind==='boss'){
      if(e.f.radar){e.f.radar.rotation.y+=dt*1.4;e.f.ring.rotation.z+=dt*1.8;e.f.ring2.rotation.y+=dt*.9;for(const b of e.f.blink)b.material.opacity=Math.sin(T*4.5+b.userData.ph*3)>.55?1:.06;}
      const ph2=e.hp<e.maxHp*.5;
      if(e.state==='enter'){m.lerp(new V3(e.slot.x,e.slot.y,e.slot.z),Math.min(1,dt*.9));if(m.distanceTo(new V3(e.slot.x,e.slot.y,e.slot.z))<2)e.state='station';}
      else{
        if(!e.mv)e.mv={hold:rand(2,3),from:m.x,to:m.x,t:0,dur:.8};
        const mv=e.mv;e.bank=0;
        if(mv.hold>0){mv.hold-=dt;if(mv.hold<=0){mv.from=m.x;let nx,tries=0;do{nx=rand(-boundX*.8,boundX*.8);}while(Math.abs(nx-m.x)<boundX*.55&&++tries<20);mv.to=nx;mv.t=0;mv.dur=rand(.55,.85);}}
        else{mv.t+=dt;const u=clamp(mv.t/mv.dur,0,1),eu=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
          m.x=mv.from+(mv.to-mv.from)*eu;e.bank=-(mv.to-mv.from)*.025*Math.sin(Math.PI*u);if(u>=1)mv.hold=rand(2.5,4.2);}
        m.y+=((1.5+Math.sin(e.t*.4)*.6)-m.y)*Math.min(1,dt);m.z+=(e.slot.z-m.z)*dt;
        if(playing){
          e.cd-=dt;e.cd2-=dt;e.cd3-=dt;
          const np=e.f.nose.getWorldPosition(tmp).clone();
          if(e.cd<=0){
            const n=11+Math.floor(D/5)*2,sp=22+D*.7;e.alt=!e.alt;
            if(e.alt){const W=Math.min(boundX*2*.92,20),cx=clamp(P.x,-boundX+W/2,boundX-W/2);
              for(let k=0;k<n;k++)eShoot(np,sp,0xff4a6a,(k/(n-1)-.5)*W,0,0,{x:cx,y:P.y});}
            else{const H=(boundY*2+.6)*.92,cy=clamp(P.y,-boundY+H/2,boundY+.6-H/2);
              for(let k=0;k<n;k++)eShoot(np,sp,0xff4a6a,0,(k/(n-1)-.5)*H,0,{x:P.x,y:cy});}
            e.cd=ph2?1.4:2;}
          if(e.cd2<=0){for(const t of e.f.turrets){const tp=t.getWorldPosition(new V3());eShoot(tp,30+D*.6,0xffc23d,0,0,.8);}e.cd2=ph2?.5:.8;}
          if(ph2){e.spiral-=dt;if(e.spiral<=0){e.sa+=.5;const R=5;
            eShoot(np,24+D*.5,0xb48bff,Math.cos(e.sa)*R,Math.sin(e.sa)*R*.7,0);
            eShoot(np,24+D*.5,0xb48bff,-Math.cos(e.sa)*R,-Math.sin(e.sa)*R*.7,0);e.spiral=.1;}}
          if(e.cd3<=0&&enemies.length<8){for(const s of[-1,1])spawnEnemy('scout',{x:clamp(m.x+s*5,-boundX,boundX),y:rand(-2,3),z:rand(-40,-50)},m.clone().add(new V3(s*6,0,0)));e.cd3=7;}
        }}
      e.m.rotation.z+=((e.bank||0)-e.m.rotation.z)*Math.min(1,dt*6);
      e.f.core.scale.setScalar(3.6+Math.sin(T*6)*.6);
    }else{
      if(e.dummy){
        m.z+=(e.slot.z-m.z)*Math.min(1,dt*1.2);
        m.x+=(e.slot.x+Math.sin(e.t*.8+e.ph)*2-m.x)*Math.min(1,dt*2);m.y+=(e.slot.y-m.y)*Math.min(1,dt*2);e.m.lookAt(P);
      }else{
      if(e.kind!=='heavy'&&e.state!=='ram'&&m.z>P.z-36){e.state='ram';clearLaser(e);e.dir=new V3(0,0,1);}
      if(e.state==='ram'){
        // same speed as approach; only the heading turns smoothly toward the player
        const sp=e.vz||14,gap=P.z-m.z;
        if(gap>9){const want=tmp.subVectors(P,m).normalize(),ang=e.dir.angleTo(want),mx=(.7+D*.015)*dt;if(ang>1e-4)e.dir.lerp(want,Math.min(1,mx/ang)).normalize();}
        m.addScaledVector(e.dir,sp*dt);m.z+=drift*dt;
        smoothLook(e.m,tmp.copy(m).add(e.dir),dt,8);
        e.halo.scale.setScalar(e.haloS*(1+.22*Math.sin(T*12)));e.halo.material.opacity=.5;
        if(m.z>P.z+8||Math.abs(m.x)>45||Math.abs(m.y)>30){
          if(!playing){scene.remove(e.m);enemies.splice(i,1);continue;}
          e.state='approach';e.t=0;e.vz=null;e.dir=null;e.halo.scale.setScalar(e.haloS);e.halo.material.opacity=.32;
          e.slot.x=rand(-boundX*.8,boundX*.8);e.slot.y=rand(-boundY*.7,boundY*.7);m.set(e.slot.x,e.slot.y,P.z-140);
        }
      }else{
        if(e.kind==='heavy'){
          // keeps its distance; holds, then glides to a new spot (boss-style)
          if(!e.mv){e.fz=rand(56,70);e.mv={hold:rand(1.2,2.2),fx:0,fy:0,tx:0,ty:0,t:0,dur:0};}
          m.z+=((P.z-e.fz)-m.z)*Math.min(1,dt*1.3);
          const mv=e.mv;
          if(mv.dur>0){mv.t+=dt;const u=Math.min(1,mv.t/mv.dur),k=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
            m.x=mv.fx+(mv.tx-mv.fx)*k;m.y=mv.fy+(mv.ty-mv.fy)*k;if(u>=1){mv.dur=0;mv.hold=rand(2.2,3.8);}}
          else{
            m.x+=Math.sin(e.t*.9+e.ph)*.6*dt;m.y+=Math.cos(e.t*1.1+e.ph)*.4*dt;
            if(!e.lz){mv.hold-=dt;if(mv.hold<=0){
              let nx,ny,tries=0;do{nx=rand(-boundX*.85,boundX*.85);ny=rand(-boundY*.7,boundY*.8);tries++;}while(Math.abs(nx-m.x)<boundX*.6&&tries<8);
              mv.fx=m.x;mv.fy=m.y;mv.tx=nx;mv.ty=ny;mv.t=0;mv.dur=rand(.6,.85);}}
          }
          smoothLook(e.m,P,dt,4);
        }else{
        const spd=(e.kind==='inter'?18:14)+D*.5;
        const tv=spd*(e.lz?.3:1);if(e.vz==null)e.vz=tv;e.vz+=(tv-e.vz)*Math.min(1,dt*2);m.z+=(e.vz+drift)*dt;
        const prog=clamp((m.z-(P.z-130))/130,0,1);
        const wx=e.slot.x+Math.sin(e.t*(e.kind==='inter'?1.8:.9)+e.ph)*(e.kind==='inter'?4:2.2);
        const wy=e.slot.y+Math.cos(e.t*1.1+e.ph)*1.2;
        const tx=wx+(P.x-wx)*prog*.6,ty=wy+(P.y-wy)*prog*.6;
        m.x+=(tx-m.x)*Math.min(1,dt*1.6);m.y+=(ty-m.y)*Math.min(1,dt*1.6);
        smoothLook(e.m,P,dt,6);
        }
        if(!playing&&e.lz)clearLaser(e);
        if(playing&&m.z>P.z-120){
          const sp=1+D*.07;
          if(e.kind==='heavy'){
            if(e.lz)updateLaser(e,dt,playing);
            else{e.cd-=dt;if(e.cd<=0&&m.z<P.z-45){e.lz={state:'charge',t:0,target:laserTarget(),tele:beamMesh(0x6ab8ff,.4),orb:glowSprite(0x6ab8ff,.5)};scene.add(e.lz.orb);lzOwners.add(e);SFX.charge();}}
          }else{
            e.cd-=dt;
            if(e.cd<=0){
              if(e.kind==='scout'){eShoot(nosePos(e),26+D*1.2,0xff4af0);e.cd=rand(1.5,2.3)/sp;}
              else{tmp.subVectors(P,m).normalize();fireMissile(nosePos(e,2),tmp.add(new V3(rand(-.3,.3),rand(.1,.4),0)));e.cd=rand(2.4,3.2)/sp;}
            }
          }
        }
      }
      }
      e.f.g.rotation.z=Math.sin(e.t*2+e.ph)*.3;
      for(let k=0;k<e.f.flames.length;k+=2)e.f.flames[k].scale.set(1,1,1+Math.random()*.4);
      if(playing&&Math.abs(m.x-P.x)<e.hx*.7+.8&&Math.abs(m.y-P.y)<e.hy+.5&&Math.abs(m.z-P.z)<e.hz+1){
        hurt();killEnemy(i,pl.boosting);continue;
      }
    }
    e.flash-=dt;e.f.mats[0].emissive.setHex(e.flash>0?0xffffff:e.baseEm);
    if(e.bar){const b=e.bar,f=clamp(e.hp/e.maxHp,0,1);b.t-=dt;b.fg.scale.x=Math.max(.001,b.w*f);b.fg.position.x=-b.w*(1-f)/2;
      b.g.quaternion.copy(e.m.quaternion).invert().multiply(camera.quaternion);b.g.visible=(b.t>0||e.kind==='heavy'||e.elite)&&e.hp<e.maxHp+1;}
    if(e.elite)e.halo.material.opacity=.4+.2*Math.sin(T*6+e.ph);
  }

  /* --- missiles --- */
  for(let i=missiles.length-1;i>=0;i--){
    const ms=missiles[i],p=ms.m.position;ms.life-=dt;
    if(p.z<P.z-7){const want=new V3().subVectors(P,p).normalize(),cur=ms.v.clone().normalize(),sp=ms.v.length();
      const ang=cur.angleTo(want),mx=1.7*dt;if(ang>1e-4){const k=Math.min(1,mx/ang);cur.lerp(want,k).normalize();}ms.v.copy(cur).multiplyScalar(sp);}
    p.addScaledVector(ms.v,dt);ms.m.lookAt(tmp.copy(p).sub(ms.v));
    if(Math.random()<.7){const s=glowSprite(0xffa040,.6,.7);s.position.copy(p);scene.add(s);flashes.push({m:s,t:0,max:.35,s:.1,v:null,shrink:true});}
    let dead=false;
    for(let j=pbul.length-1;j>=0;j--){const b=pbul[j].m.position;if(Math.abs(b.x-p.x)<.7&&Math.abs(b.y-p.y)<.7&&Math.abs(b.z-p.z)<1.4){scene.remove(pbul[j].m);pbul.splice(j,1);dead=true;score+=20;break;}}
    if(!dead&&playing&&p.distanceTo(P)<.95){hurt();dead=true;}
    if(dead){explode(p.clone(),0xffc23d,.4);scene.remove(ms.m);missiles.splice(i,1);continue;}
    if(ms.life<=0||p.z>P.z+12){scene.remove(ms.m);missiles.splice(i,1);}
  }

  sweepLasers();

  /* --- enemy bullets --- */
  for(let i=ebul.length-1;i>=0;i--){
    const b=ebul[i];b.m.position.addScaledVector(b.v,dt);
    if(playing&&b.m.position.distanceTo(P)<.85){hurt();scene.remove(b.m);ebul.splice(i,1);continue;}
    if(b.m.position.z>P.z+15||Math.abs(b.m.position.x)>60||Math.abs(b.m.position.y)>40){scene.remove(b.m);ebul.splice(i,1);}
  }

  /* --- pickups --- */
  for(let i=pickups.length-1;i>=0;i--){
    const u=pickups[i],p=u.g.position;p.z+=(18+drift)*dt;u.g.rotation.y+=dt*(u.kind==='coin'?4:2);if(u.kind!=='coin')u.g.rotation.x+=dt*1.3;p.y+=Math.sin(T*2+u.ph)*dt*.6;
    if(S.magnet&&playing){const dd=p.distanceTo(P);if(dd<8&&dd>.1){tmp.subVectors(P,p).normalize();p.addScaledVector(tmp,28*dt);}}
    if(playing&&p.distanceTo(P)<2.1){
      if(u.kind==='coin'){runCoins+=u.val*S.coin;tone(1568,2093,.1,.04,'sine');setTimeout(()=>tone(2349,2349,.08,.025,'sine'),50);}
      else if(u.kind==='core'){pl.boost=Math.min(pl.bcap,pl.boost+35);SFX.pick(500);score+=50;}
      
      else{pl.hp=Math.min(pl.maxHp,pl.hp+1);drawHull();SFX.pick(400);}
      spark(p,0xffffff);scene.remove(u.g);pickups.splice(i,1);continue;
    }
    if(p.z>P.z+12){scene.remove(u.g);pickups.splice(i,1);}
  }

  /* --- fx --- */
  for(let i=flashes.length-1;i>=0;i--){const f=flashes[i];f.t+=dt;const u=f.t/f.max;
    if(f.v)f.m.position.addScaledVector(f.v,dt);
    if(f.shrink)f.m.scale.setScalar(.8*(1-u));else f.m.scale.setScalar(f.s*Math.sqrt(u)+.1);
    f.m.material.opacity=1-u;if(u>=1){scene.remove(f.m);f.m.material.dispose();flashes.splice(i,1);}}
  for(let i=shards.length-1;i>=0;i--){const s=shards[i];s.life-=dt;s.m.position.addScaledVector(s.v,dt);s.v.multiplyScalar(.97);
    s.m.rotation.x+=dt*9;s.m.rotation.y+=dt*7;s.m.scale.setScalar(Math.max(.01,s.life));if(s.life<=0){scene.remove(s.m);shards.splice(i,1);}}

  /* --- contrails & nav lights --- */
  updateTrails(dt,game==='play'&&pl.alive&&pl.g.visible);
  if(pl.blink)for(const b of pl.blink)b.material.opacity=((T+b.userData.ph)%1.2)<.14?1:.18;
  /* --- space --- */
  const camZ=camera.position.z;
  for(let i=0;i<SN;i++){const s=sDat[i];s.z+=worldSpeed*s.m*dt;if(s.z>camZ+2)resetStar(s,camZ-rand(350,500));
    const len=.4+worldSpeed*s.m*.028;sPos.set([s.x,s.y,s.z,s.x,s.y,s.z-len],i*6);}
  sGeo.attributes.position.needsUpdate=true;
  for(const r of rocks){r.m.position.z+=worldSpeed*.45*dt;r.m.rotation.x+=r.rx*dt;r.m.rotation.y+=r.ry*dt;if(r.m.position.z>camZ+10)placeRock(r.m,camZ-rand(380,480));}
  planet.rotation.y+=dt*.01;station.rotation.z+=dt*.05;moon.rotation.y+=dt*.02;

  /* --- camera --- */
  shake=Math.max(0,shake-dt*1.5);
  if(game==='lobby'||game==='hangar'){camInit=false;
    P.set(0,Math.sin(T*.9)*.15,0);pl.g.rotation.set(.18+Math.sin(T*.7)*.04,-.6+Math.sin(T*.25)*.5,Math.sin(T*.5)*.12);
    const narrow=camera.aspect<1.4;camera.fov+=((narrow?62:44)-camera.fov)*Math.min(1,dt*3+.001);camera.updateProjectionMatrix();
    camera.position.set(-2.6,1.2,7);camera.lookAt(-2.6,.1,0);
  }else{
    camera.fov=55+2.5*boostK;camera.updateProjectionMatrix();
    const kc=camInit?(dt>0?1-Math.exp(-dt*9):0):1;camInit=true;
    camBase.lerp(tmp.set(P.x*.45,P.y*.35+2.2,P.z+13),kc);camLook.lerp(tmp.set(P.x*.3,P.y*.25,P.z-30),kc);
    const sk=(reduceMotion||!settings.shake)?0:shake*.5;
    camera.position.set(camBase.x+rand(-sk,sk),camBase.y+rand(-sk,sk),camBase.z);
    camera.lookAt(camLook);if(game==='play')camera.rotateZ(pl.g.rotation.z*.1);
  }
  BG.position.copy(camera.position);
  if(game==='play'||game==='result')updateHud();
  musicFrame();
  if(composer&&settings.bloom)composer.render();else renderer.render(scene,camera);
}
drawHull();applySettings();toLobby();
/* ---- cloud save: keeps progress in the claude.ai artifact store (per viewer, private) ---- */
(async()=>{
  try{
    let w=0;while(!(window.claude&&window.claude.use)&&w<30){await new Promise(r=>setTimeout(r,100));w++;}
    if(!(window.claude&&window.claude.use))return;
    const[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;const uid=await user.id();if(!uid)return;
    const ref=db.doc('data/users/'+uid+'/save');const snap=await ref.get();
    cloudRef=ref;
    const d=snap.exists?snap.data():null;
    if(d&&d.prog&&(d.t||0)>(prog._t||0)){
      for(const k of Object.keys(prog))delete prog[k];Object.assign(prog,{unlocked:1,best:{},stars:{}},d.prog);normProg();
      try{localStorage.setItem('void-prog',JSON.stringify(prog));}catch(e){}
      if(d.set){Object.assign(settings,d.set);try{localStorage.setItem('void-set',JSON.stringify(settings));}catch(e){}for(const[id,key]of Object.entries(SET_UI)){const el=$(id);if(el.type==='checkbox')el.checked=!!settings[key];else el.value=settings[key];}applySettings();}
      if(game==='lobby')toLobby();else if(game==='hangar')renderHangar();
    }else if(prog._t||prog.coins||prog.unlocked>1)cloudPush();
  }catch(e){cloudRef=null;}
})();
loop();
})();
</script>
